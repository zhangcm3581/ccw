# deploy/versions.lock —— 版本固定清单（Design Spec §16 / 审查§3.2）
#
# 规则：正式实施步骤禁止 @latest 或未固定版本的安装。任何版本变动必须先改本文件，
# 再改对应的 Dockerfile / compose.yaml / go.mod，两边保持一致。
# 本文件是人工维护的清单，不被任何构建流程读取——改了别的地方就要回来改这里。
#
# 最后核对：2026-07-25（分支 v2，commit 4bbd4c0）

