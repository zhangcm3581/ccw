@anthropic-ai/claude-code    未固定 ⚠                              # deploy/.env.example 的 CLAUDE_CODE_VERSION 默认为空＝装最新

## 未固定项（已知欠账，见 docs/STATUS.md 的 P2）
#
# 1. 所有镜像按 tag 拉取，未按 digest 固定。tag 会被上游重新推送，
#    严格复现需要改成 image@sha256:<digest> 的形式并在此记录 digest。
# 2. CLAUDE_CODE_VERSION 默认为空即安装最新版，与"禁止 @latest"直接冲突。
#    生产部署必须在 .env 里填具体版本号；升级前先用脱敏 JSONL 样例
#    （internal/usage/testdata/session-sample.jsonl）跑解析兼容测试，
#    再跑 tmux 断连恢复验证（Design Spec §16）。
# 3. apt 安装的 tmux / git / docker.io / nodejs 具体包版本随基础镜像浮动，
#    未做 apt pinning。
# 4. Console 的 bootstrap 流水线用 https://get.docker.com 便捷脚本装 Docker，
#    装的是上游 stable 最新版，未固定。固定版本需按发行版拼 apt 版本串，
#    且各发行版可用版本不同；当前接受该未固定项。
