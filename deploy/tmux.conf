# 项目容器里的 tmux 配置（2026-07-31，真机渲染问题后加）。
#
# 之前没有这个文件，全是默认值，两条默认值在这套用法里是错的：
#
#   1. default-terminal 默认是 "screen"——容器里的 Claude Code 据此认为终端只有
#      8 色、能力受限，而它是一个重绘频繁的 TUI。改成 tmux-256color
#      （ubuntu:24.04 的 ncurses-base 自带这份 terminfo，已实测）。
#   2. mouse 默认 off——**官方文档明确要求开启**：Claude Code 的 fullscreen 渲染
#      要靠 tmux 转发鼠标事件，否则滚轮事件被 tmux 自己吃掉，滚动落到外层终端
#      而不是 Claude 内部（code.claude.com/docs/en/fullscreen 的 "Use with tmux"）。

set -g default-terminal "tmux-256color"

# 真彩色透传：外层是 xterm-256color / Windows Terminal 这类支持 24 位色的终端时，
# 不加这条会被降到 256 色近似。*256col* 与 xterm* 都覆盖，因为 docker exec
# 写死过 TERM=xterm。
set -ga terminal-overrides ",*256col*:Tc,xterm*:Tc"

# 滚轮交给 tmux。
set -g mouse on

# escape-time 默认 500ms：tmux 会等这么久来判断 ESC 是单独按键还是转义序列的
# 开头，表现是按 Esc 后有明显延迟。设 0 是跑 TUI 时的常规做法。
#
# **它不修左侧残影**。最初加这条时我把它写成了残影的成因，那是推断且推错了：
# 真实成因是 Windows Terminal（ConPTY）错误合并 fullscreen 的增量定位写入，
# 官方修复是 CLAUDE_CODE_ALT_SCREEN_FULL_REPAINT=1（已在 compose 里设置）。
set -s escape-time 0

# 回滚缓冲：默认 2000 行，对话一长就翻不到前面。
set -g history-limit 20000

# 终端标题跟随，方便在本地终端的标签页上看出连的是哪个工作区。
set -g set-titles on
set -g set-titles-string "#S"
