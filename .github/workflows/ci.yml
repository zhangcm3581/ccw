# CI：编译、单测、竞态、格式检查。
#
# 全部单测无外部依赖（Docker与数据库逻辑用假API/内存实现），因此不需要service容器；
# 需要真实PostgreSQL的store集成测试靠CCW_TEST_DATABASE_URL开关，未设置时自动skip。
#
# Go版本固定为deploy/versions.lock里的值——改这里必须同时改那里（CLAUDE.md：禁止未固定版本）。
name: ci

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.5' # 与 deploy/versions.lock 的 go 一致
          cache: true

      - name: gofmt
        # gofmt -l 列出未格式化的文件；有输出即失败（CLAUDE.md：应无输出）
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未格式化："
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 节点源码包可生成且含构建所需文件
        # 纳管时这个包被推到节点、节点靠它构建镜像。少了任何一样，
        # compose-up会在真机上才失败——本地就把它挡住。
        run: |
          ./scripts/build-node-src.sh /tmp/node-src.tar.gz
          for f in ./go.mod ./deploy/Dockerfile.control-api ./deploy/Caddyfile \
                   ./cmd/control-api/main.go ./internal/store/migrations/001_initial.sql; do
            tar tzf /tmp/node-src.tar.gz | grep -qx "$f" || { echo "源码包缺 $f"; exit 1; }
          done
          echo "节点源码包完整"

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

      - name: test -race
        run: go test -race ./...

  # 渲染出的compose必须能被真实的docker compose解析（验收B2）：
  # 黄金文件锁定了字节，这里锁定"字节是合法编排"。ubuntu runner自带docker与compose插件。
  compose-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        env:
          POSTGRES_PASSWORD: dummy
          CCW_TOKEN_KEY: deadbeef
          CCW_DOMAIN: example.com
        run: |
          for f in deploy/compose.yaml internal/deploy/testdata/compose-*.golden.yaml; do
            cp "$f" deploy/.ci-compose.yaml
            docker compose -f deploy/.ci-compose.yaml -p ci config > /dev/null
            echo "OK: $f"
          done
          rm -f deploy/.ci-compose.yaml

      - name: docker compose config（Console栈）
        env:
          CONSOLE_POSTGRES_PASSWORD: dummy
          CCW_SITE_DOMAIN: ccw.example.com
          CCW_ADMIN_DOMAIN: admin.example.com
          CCW_ADMIN_ALLOWLIST: 127.0.0.1
        run: docker compose -f deploy/console/compose.yaml -p ci-console config > /dev/null

  # store的用量写入端（幂等键、GREATEST语义、游标往返）只能对真实PostgreSQL验证：
  # 那些行为在SQL里，假实现测不到。没有这个job，internal/store的测试会永远停在skip，
  # 等于"没验证"被当成"通过"——正是CLAUDE.md禁止的那种误报。
  store-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16 # 与 deploy/compose.yaml 及 versions.lock 一致
        env:
          POSTGRES_USER: ccw
          POSTGRES_PASSWORD: ccw-ci
          POSTGRES_DB: ccw_test
        options: >-
          --health-cmd "pg_isready -U ccw"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.5'
          cache: true

      - name: store集成测试（节点库 + Console库）
        env:
          CCW_TEST_DATABASE_URL: postgres://ccw:ccw-ci@127.0.0.1:5432/ccw_test?sslmode=disable
        # -v让skip与pass在日志里可分辨（避免skip被当成通过）。
        # consolestore的测试助手会在同一实例上自建独立数据库ccw_console_test。
        run: go test -v -race ./internal/store/... ./internal/consolestore/...
