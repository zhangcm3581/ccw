{{define "layout"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}cclaude · 云端 Claude Code 工作空间{{end}}</title>
<style>
/* 公开站：落地页 + 开始使用（/connect）。
   自包含样式，不引用任何外部CDN（设计§3.3——下载页不应因第三方不可达而挂掉）。

   配色与管理后台同源（2026-07-27定）：珊瑚橙做唯一强调色、暖米白底、暖炭深色模式。
   两边共用一组色值，只在密度上不同——后台是操作台，这里是文档，
   所以字更大、行更松、留白更多。 */
:root{
  --ground:#faf9f7;  --panel:#ffffff;   --sunk:#f4f2ee;
  --line:#e6e1d9;    --line-soft:#efebe4;
  --ink:#1f1e1d;     --ink-2:#5c5955;   --ink-3:#8b8781;
  --accent:#c96442;  --accent-ink:#ffffff; --accent-wash:#f9e9e1;
  --ok:#2f7a5b;      --warn:#96631a;    --bad:#b0453a;
  --warn-wash:#f9edd8;
  --code-bg:#f4f2ee;
  --shadow:0 1px 2px rgba(31,30,29,.05), 0 10px 28px -18px rgba(31,30,29,.3);
  --sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#1f1e1d; --panel:#282725;  --sunk:#191817;
    --line:#3a3835;   --line-soft:#302e2b;
    --ink:#f5f3ee;    --ink-2:#a8a29a;  --ink-3:#7c7770;
    --accent:#e08a6b; --accent-ink:#2a1610; --accent-wash:#3b2419;
    --ok:#5fae8a;     --warn:#d9a552;   --bad:#e08278;
    --warn-wash:#332818;
    --code-bg:#191817;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.65);
  }
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:940px;margin:0 auto;padding:0 24px}

header{
  border-bottom:1px solid var(--line);background:var(--ground);
  position:sticky;top:0;z-index:10;
}
header .wrap{display:flex;align-items:center;gap:26px;height:64px}
header .brand{
  display:flex;align-items:center;gap:10px;
  font-weight:700;font-size:18px;letter-spacing:-.02em;color:var(--ink);
}
header .brand:hover{text-decoration:none}
header .brand .mark{
  width:26px;height:26px;flex:none;fill:var(--accent);
}
header nav{display:flex;gap:22px;font-size:14.5px}
header nav a{color:var(--ink-2)}
header nav a:hover{color:var(--ink);text-decoration:none}

main{padding:56px 0 88px}
footer{
  border-top:1px solid var(--line);padding:28px 0;
  color:var(--ink-3);font-size:13.5px;
}

/* 标题：参考里那种重而紧的排法。中文标题字重靠系统字体，
   所以用字号与字距拉开层级，而不是指望更多字重档位。 */
h1{font-size:40px;line-height:1.25;letter-spacing:-.03em;font-weight:750;margin:0 0 16px}
h2{font-size:23px;line-height:1.4;letter-spacing:-.02em;font-weight:700;margin:52px 0 14px}
h3{font-size:16.5px;letter-spacing:-.01em;font-weight:680;margin:0 0 8px}
p.lead{font-size:18.5px;line-height:1.7;color:var(--ink-2);margin:0 0 28px;max-width:62ch}

.btn{
  display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:10px;
  background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;
  border:1px solid transparent;cursor:pointer;font-family:inherit;
}
.btn:hover{filter:brightness(1.06);text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);filter:none}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin:28px 0}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:22px;box-shadow:var(--shadow);
}
.card h3{margin:0 0 8px}
.card p{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.7}

code,pre{font-family:var(--mono);font-size:13.5px}
code{background:var(--code-bg);padding:2.5px 7px;border-radius:6px}
pre{
  background:var(--code-bg);border:1px solid var(--line-soft);
  padding:16px 18px;border-radius:12px;overflow-x:auto;line-height:1.65;
}
pre code{background:none;padding:0}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th{
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;
}
tbody tr:last-child td{border-bottom:none}
td.sha{font-family:var(--mono);font-size:12px;max-width:280px;overflow:hidden;text-overflow:ellipsis}

.notice{
  background:var(--accent-wash);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:0 12px 12px 0;padding:14px 18px;font-size:14.5px;margin:20px 0;
}
.notice.warn{border-left-color:var(--warn);background:var(--warn-wash)}
.muted{color:var(--ink-3)}
.ok{color:var(--ok)}
.warn{color:var(--warn)}

input[type=text]{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel);color:var(--ink);font-family:var(--mono);font-size:14px;
}
input[type=text]:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-wash)}

/* 步骤条：三步是真实的顺序，所以编号承载信息，不是装饰。 */
.steps{counter-reset:step;list-style:none;padding:0;margin:28px 0}
.steps li{counter-increment:step;position:relative;padding:0 0 24px 48px}
.steps li::before{
  content:counter(step,decimal-leading-zero);position:absolute;left:0;top:3px;
  width:30px;height:30px;border-radius:10px;
  background:var(--accent-wash);color:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12px;font-weight:700;
}

@media (max-width:640px){
  h1{font-size:31px}
  h2{font-size:20px;margin-top:40px}
  main{padding:36px 0 64px}
  header .wrap{gap:16px}
  header nav{gap:14px;font-size:13.5px}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="/"><svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><path d="M56.2 50.0 Q55.6 35.9 50.0 3.0 Q44.4 35.9 43.8 50.0 Z M55.4 53.1 Q59.8 44.2 66.5 21.4 Q50.1 38.6 44.6 46.9 Z M53.1 55.4 Q64.2 48.2 88.1 28.0 Q58.6 38.6 46.9 44.6 Z M50.0 56.2 Q59.0 55.6 80.0 50.0 Q59.0 44.4 50.0 43.8 Z M46.9 55.4 Q59.2 61.7 89.8 73.0 Q64.7 52.1 53.1 44.6 Z M44.6 53.1 Q50.0 61.1 66.0 77.7 Q59.6 55.5 55.4 46.9 Z M43.8 50.0 Q44.4 63.5 50.0 95.0 Q55.6 63.5 56.2 50.0 Z M44.6 46.9 Q40.5 55.3 34.5 76.8 Q50.2 60.8 55.4 53.1 Z M46.9 44.6 Q35.0 52.2 9.3 73.5 Q40.6 61.9 53.1 55.4 Z M50.0 43.8 Q39.8 44.4 16.0 50.0 Q39.8 55.6 50.0 56.2 Z M53.1 44.6 Q41.6 38.7 12.8 28.5 Q36.0 48.4 46.9 55.4 Z M55.4 46.9 Q50.3 39.4 35.0 24.0 Q40.7 45.0 44.6 53.1 Z"/></svg>cclaude</a>
    <nav>
      <a href="/connect">开始使用</a>
    </nav>
  </div>
</header>
<main><div class="wrap">
{{template "content" .}}
</div></main>
<footer><div class="wrap">cclaude · 远程 Claude Code 工作空间。用量计量为内部额度单位（内部估算口径）。</div></footer>
</body>
</html>{{end}}
