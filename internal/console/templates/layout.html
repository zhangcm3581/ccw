{{define "layout"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}ccw · 云端 Claude Code 工作空间{{end}}</title>
<style>
/* 自包含样式：不引用任何外部CDN（设计§3.3——下载页不应因第三方不可达而挂掉） */
:root{
  --bg:#ffffff;--fg:#1a1a1a;--muted:#666;--line:#e3e3e3;--card:#f7f7f8;
  --accent:#4f46e5;--accent-fg:#ffffff;--code-bg:#f0f0f2;--ok:#15803d;--warn:#b45309;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#101014;--fg:#ececf1;--muted:#9a9aa5;--line:#2a2a32;--card:#17171d;
    --accent:#818cf8;--accent-fg:#101014;--code-bg:#1e1e26;--ok:#4ade80;--warn:#fbbf24;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:920px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:24px;height:56px}
header .brand{font-weight:700;font-size:18px;color:var(--fg)}
header nav{display:flex;gap:18px;font-size:14px}
main{padding:40px 0 64px}
footer{border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:13px}
h1{font-size:32px;line-height:1.3;margin:0 0 12px}
h2{font-size:20px;margin:36px 0 12px}
p.lead{font-size:18px;color:var(--muted);margin:0 0 24px}
.btn{display:inline-block;padding:10px 18px;border-radius:8px;background:var(--accent);
  color:var(--accent-fg);font-weight:600;border:none;cursor:pointer;font-size:15px}
.btn:hover{opacity:.9;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:24px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.card h3{margin:0 0 8px;font-size:16px}
.card p{margin:0;color:var(--muted);font-size:14px}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px}
code{background:var(--code-bg);padding:2px 6px;border-radius:5px}
pre{background:var(--code-bg);padding:14px 16px;border-radius:8px;overflow-x:auto}
pre code{background:none;padding:0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600}
td.sha{font-family:ui-monospace,Menlo,monospace;font-size:12px;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.notice{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:8px;padding:12px 16px;font-size:14px;margin:16px 0}
.muted{color:var(--muted)}
.ok{color:var(--ok)}
.warn{color:var(--warn)}
input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--fg);font-family:ui-monospace,Menlo,monospace;font-size:14px}
.steps{counter-reset:step;list-style:none;padding:0;margin:24px 0}
.steps li{counter-increment:step;position:relative;padding:0 0 20px 44px}
.steps li::before{content:counter(step);position:absolute;left:0;top:2px;width:28px;height:28px;
  border-radius:50%;background:var(--accent);color:var(--accent-fg);font-weight:700;
  display:flex;align-items:center;justify-content:center;font-size:14px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="/">ccw</a>
    <nav>
      <a href="/download">下载</a>
      <a href="/quickstart">快速开始</a>
      <a href="/connect">查询接入地址</a>
    </nav>
  </div>
</header>
<main><div class="wrap">
{{template "content" .}}
</div></main>
<footer><div class="wrap">ccw · 远程 Claude Code 工作空间。用量计量为内部额度单位（内部估算口径）。</div></footer>
</body>
</html>{{end}}
