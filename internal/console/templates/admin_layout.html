{{define "layout"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}控制台 · ccw{{end}}</title>
<script>
// 主题在首屏绘制前定好，避免深色偏好下先闪一下白底。
// 三态：auto（跟随系统）/ light / dark，存 localStorage。
(function () {
  try {
    var t = localStorage.getItem('ccw-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<style>
/* ccw 控制台 —— 单管理员的运维操作台。
   设计取向：这是仪表盘不是文档。机器值一律等宽字体，状态用形状+颜色双编码，
   信息密度优先于留白。零外部资源（CSP 禁止外链）。

   配色沿用 Claude 那套暖调（2026-07-27定）：珊瑚橙做唯一强调色，
   底色是偏暖的米白而不是冷灰，深色模式是暖炭色而不是蓝黑。
   **公开站与后台共用同一组色值**，两边只在密度上不同——
   同一个产品不该有两套色。 */
:root{
  --ground:#faf9f7;   --panel:#ffffff;   --rail:#f4f2ee;
  --line:#e6e1d9;     --line-soft:#efebe4;
  --ink:#1f1e1d;      --ink-2:#5c5955;   --ink-3:#8b8781;
  --accent:#c96442;   --accent-ink:#ffffff; --accent-wash:#f9e9e1;
  --ok:#2f7a5b;       --ok-wash:#e2f0e8;
  --warn:#96631a;     --warn-wash:#f9edd8;
  --bad:#b0453a;      --bad-wash:#fbe6e1;
  --idle:#8b8781;     --idle-wash:#eeeae3;
  --run:#3f7a99;      --run-wash:#e2eef4;
  --term-bg:#1f1e1d;  --term-ink:#e5e1d8;
  --shadow:0 1px 2px rgba(31,30,29,.05), 0 10px 28px -18px rgba(31,30,29,.3);
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --sans:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#1f1e1d; --panel:#282725; --rail:#191817;
    --line:#3a3835;   --line-soft:#302e2b;
    --ink:#f5f3ee;    --ink-2:#a8a29a;  --ink-3:#7c7770;
    --accent:#e08a6b; --accent-ink:#2a1610; --accent-wash:#3b2419;
    --ok:#5fae8a;     --ok-wash:#1d2f26;
    --warn:#d9a552;   --warn-wash:#332818;
    --bad:#e08278;    --bad-wash:#37211d;
    --idle:#6d6862;   --idle-wash:#2c2a27;
    --run:#78b0cc;    --run-wash:#1b2c36;
    --term-bg:#151413; --term-ink:#ddd8cd;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --ground:#1f1e1d; --panel:#282725; --rail:#191817;
  --line:#3a3835;   --line-soft:#302e2b;
  --ink:#f5f3ee;    --ink-2:#a8a29a;  --ink-3:#7c7770;
  --accent:#e08a6b; --accent-ink:#2a1610; --accent-wash:#3b2419;
  --ok:#5fae8a;     --ok-wash:#1d2f26;
  --warn:#d9a552;   --warn-wash:#332818;
  --bad:#e08278;    --bad-wash:#37211d;
  --idle:#6d6862;   --idle-wash:#2c2a27;
  --run:#78b0cc;    --run-wash:#1b2c36;
  --term-bg:#151413; --term-ink:#ddd8cd;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.65);
}
:root[data-theme="light"]{
  --ground:#faf9f7; --panel:#ffffff; --rail:#f4f2ee;
  --line:#e6e1d9;   --line-soft:#efebe4;
  --ink:#1f1e1d;    --ink-2:#5c5955;  --ink-3:#8b8781;
  --accent:#c96442; --accent-ink:#ffffff; --accent-wash:#f9e9e1;
  --ok:#2f7a5b;     --ok-wash:#e2f0e8;
  --warn:#96631a;   --warn-wash:#f9edd8;
  --bad:#b0453a;    --bad-wash:#fbe6e1;
  --idle:#8b8781;   --idle-wash:#eeeae3;
  --run:#3f7a99;    --run-wash:#e2eef4;
  --term-bg:#1f1e1d; --term-ink:#e5e1d8;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--sans);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── 骨架：左轨 + 内容 ───────────────────────────── */
/* **这套后台只面向 PC**（2026-07-27定）：它是纳管服务器用的操作台，
   步骤表、日志流、SSH 参数表单没有一个适合在手机上操作。
   因此不做窄屏适配，改为给整个外壳一个下限宽度——窗口比这窄就整体横滚，
   而不是把布局折成一个能打开、但没法用的形态。
   minmax(0,1fr)而不是1fr：网格列的默认min-width是auto，
   宽表格会把这一列撑破，横向滚动条出现在<body>而不是表格自己身上。 */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%;min-width:1080px}
.rail{
  background:var(--rail);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:20;
}
.rail-brand{
  display:flex;align-items:center;gap:10px;
  padding:18px 20px 16px;border-bottom:1px solid var(--line-soft);
}
.rail-brand .mark{
  width:27px;height:27px;border-radius:9px;flex:none;
  background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:-.03em;
}
.rail-brand b{font-size:15.5px;letter-spacing:-.02em;line-height:1.2;font-weight:700}
/* 只给「控制台」那行做等宽大写，不要写成 .rail-brand span——
   那会把标识块里的 cc 和产品名 ccw 一起大写掉，而产品名是小写的。 */
.rail-brand .sub{
  display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);
}
.rail-nav{padding:14px 12px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav-label{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);padding:14px 8px 6px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:var(--r-sm);
  color:var(--ink-2);font-size:14px;text-decoration:none;
  position:relative;
}
.nav-item:hover{background:var(--panel);color:var(--ink);text-decoration:none}
.nav-item[aria-current="page"]{background:var(--accent-wash);color:var(--accent);font-weight:600}
/* 当前项左侧一道竖条：底色在深浅两套主题下对比度不同，
   形状不受主题影响，「我在哪一页」始终一眼可见。 */
.nav-item[aria-current="page"]::before{
  content:"";position:absolute;left:0;top:7px;bottom:7px;width:2.5px;
  border-radius:0 2px 2px 0;background:var(--accent);
}
.nav-item .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55;flex:none}
.nav-item .tally{
  margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.nav-item.muted{color:var(--ink-3);cursor:default}
.nav-item.muted:hover{background:none;color:var(--ink-3)}
.rail-foot{border-top:1px solid var(--line-soft);padding:14px}
.who{display:flex;align-items:center;gap:9px;margin-bottom:10px}
/* 主题三态开关：跟随系统是默认值，所以它必须是可回到的一个档位，
   而不是只在浅/深之间来回切——切过一次就再也回不去系统偏好。 */
.theme{display:flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;margin-bottom:10px}
.theme button{
  flex:1;padding:4px 0;border:none;background:transparent;cursor:pointer;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--ink-3);
  border-right:1px solid var(--line);
}
.theme button:last-child{border-right:none}
.theme button:hover{color:var(--ink)}
.theme button[aria-pressed="true"]{background:var(--accent-wash);color:var(--accent);font-weight:600}
.who .av{
  width:26px;height:26px;border-radius:var(--r-sm);background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12px;font-weight:700;flex:none;
}
.who .nm{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}
.signout{
  width:100%;padding:7px;border:1px solid var(--line);background:transparent;border-radius:var(--r-sm);
  color:var(--ink-2);font-family:var(--sans);font-size:12.5px;cursor:pointer;
}
.signout:hover{border-color:var(--bad);color:var(--bad)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:20px 30px;border-bottom:1px solid var(--line);background:var(--ground);
  position:sticky;top:0;z-index:5;
}
.topbar h1{font-size:21px;margin:0;letter-spacing:-.025em;font-weight:700}
.topbar .sub{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.topbar .spacer{margin-left:auto}
/* 1560是表格的可读上限：再宽下去「节点—状态—地址」之间的横向跨度
   会大到眼睛要来回找行。超宽屏上留白比拉伸更好读。 */
.content{padding:26px 30px 64px;max-width:1560px}

/* ── 通用件 ─────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:var(--r-sm);
  background:var(--accent);color:var(--accent-ink);border:1px solid transparent;
  font-family:var(--sans);font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none;
}
.btn:hover{filter:brightness(1.07);text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);filter:none}
/* danger不做成实心红：它和旁边的常规操作长得越像，越容易误点。
   平时是安静的描边，悬停时才变红——手已经在上面了，此时才需要警告。 */
.btn.danger{background:transparent;color:var(--ink-2);border-color:var(--line)}
.btn.danger:hover{background:var(--bad-wash);color:var(--bad);border-color:var(--bad);filter:none}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-hd{
  display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line-soft);
}
.card-hd h2{font-size:14.5px;margin:0;font-weight:680;letter-spacing:-.01em}
.card-hd .spacer{margin-left:auto}
.card-bd{padding:18px}
/* 卡片底栏放动作。与表格之间要有一条分隔线，否则按钮看起来像最后一行数据。 */
.card-ft{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 18px;border-top:1px solid var(--line-soft);background:var(--ground);
  border-radius:0 0 var(--r-lg) var(--r-lg);
}
.card-ft .spacer{margin-left:auto}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}

/* ── 总览的两栏工作区 ─────────────────────────────
   左栏是「要做的事」：待办 + 部署流水，随内容长；
   右栏是「当前是什么状态」：机队、发布、域名，各自短小、只读。
   把它们并排而不是纵向摞成一长条——后者在 1440 屏上要滚一屏才看完，
   而这台机器的全部状态本来就装得下一屏。 */
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:22px;align-items:start}
.workspace .stack{display:flex;flex-direction:column;gap:22px;min-width:0}
/* 表单不跟着屏幕一起变宽：一个 IP 输入框拉到 700px 只会更难填，
   而且眼睛要在标签与输入框之间横跨半屏。 */
.narrow{max-width:1080px}

.eyebrow{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 10px;
}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--ink-3)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* 状态徽标：颜色 + 形状双编码，不只靠颜色区分 */
.st{
  display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 7px;border-radius:20px;
  font-family:var(--mono);font-size:11px;letter-spacing:.02em;white-space:nowrap;font-weight:500;
}
.st::before{content:"";width:6px;height:6px;flex:none;background:currentColor}
.st-ok{color:var(--ok);background:var(--ok-wash)}
.st-ok::before{border-radius:50%}
.st-run{color:var(--run);background:var(--run-wash)}
.st-run::before{border-radius:50%;animation:pulse 1.4s ease-in-out infinite}
.st-warn{color:var(--warn);background:var(--warn-wash)}
.st-warn::before{clip-path:polygon(50% 0,100% 100%,0 100%)}
.st-bad{color:var(--bad);background:var(--bad-wash)}
.st-bad::before{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.st-idle{color:var(--idle);background:var(--idle-wash)}
.st-idle::before{border-radius:1px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

table{border-collapse:collapse;width:100%;font-size:13.5px}
.tablewrap{overflow-x:auto}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
th{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;white-space:nowrap;
}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--ground)}
td.nowrap{white-space:nowrap}

.note{
  border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--accent-wash);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:13px 17px;font-size:13.5px;
}
.note.warn{border-left-color:var(--warn);background:var(--warn-wash)}
.note.bad{border-left-color:var(--bad);background:var(--bad-wash)}
.note.ok{border-left-color:var(--ok);background:var(--ok-wash)}
.note b{font-weight:650}
.note code,code{
  font-family:var(--mono);font-size:.88em;background:var(--idle-wash);
  padding:1.5px 5px;border-radius:3px;
}

/* 接入引导：全新安装时总览唯一有内容的东西。
   用勾选而不是序号——三件事有先后，但真正要传达的是「哪几件已经做完了」。 */
.onboard{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.onboard li{
  display:flex;align-items:center;gap:13px;padding:12px 0;
  border-bottom:1px solid var(--line-soft);
}
.onboard li:last-child{border-bottom:none}
.onboard li > div{flex:1;min-width:0}
.onboard b{display:block;font-size:14px;font-weight:600;margin-bottom:1px}
.onboard span:not(.tick){font-size:13px;color:var(--ink-3)}
.onboard .tick{
  width:18px;height:18px;border-radius:50%;flex:none;
  border:1.5px solid var(--line);position:relative;
}
.onboard li.done .tick{background:var(--ok);border-color:var(--ok)}
.onboard li.done .tick::after{
  content:"";position:absolute;left:5px;top:2px;width:5px;height:9px;
  border:solid #fff;border-width:0 1.8px 1.8px 0;transform:rotate(42deg);
}
.onboard li.done b{color:var(--ink-3);font-weight:500}

.empty{text-align:center;padding:44px 20px;color:var(--ink-3)}
.empty h3{color:var(--ink);font-size:16px;margin:0 0 6px;font-weight:680;letter-spacing:-.01em}
.empty p{margin:0 0 18px;font-size:13.5px}

label.fld{display:block;margin-bottom:14px}
label.fld .lb{
  display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;
}
label.fld .hint{display:block;font-size:12.5px;color:var(--ink-3);margin-top:5px;line-height:1.5}
input[type=text],input[type=password],select{
  width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--panel);color:var(--ink);font-family:var(--mono);font-size:13px;
}
input:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-wash)}
.row2{display:grid;grid-template-columns:1fr 120px;gap:12px}

/* ── 签名件：bootstrap 步骤轨 ──────────────────────
   12 步是真实的顺序，所以用序列化的形状表达它是恰当的。
   一眼看出「跑到哪一步、卡在哪一步」，比任何计数卡片都有用。 */
.rail-steps{display:flex;gap:3px;align-items:stretch}
.rail-steps .seg{
  flex:1;height:6px;border-radius:2px;background:var(--idle-wash);
  border:1px solid transparent;min-width:6px;
}
.rail-steps .seg.done{background:var(--ok)}
.rail-steps .seg.skip{background:transparent;border-color:var(--ok)}
.rail-steps .seg.run{background:var(--run);animation:pulse 1.4s ease-in-out infinite}
.rail-steps .seg.fail{background:var(--bad)}
.rail-cap{
  display:flex;justify-content:space-between;gap:10px;margin-top:7px;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);
}

.steplist{display:flex;flex-direction:column}
.steplist .s{
  display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--line-soft);
}
.steplist .s:last-child{border-bottom:none}
.steplist .s .idx{
  font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:right;
  font-variant-numeric:tabular-nums;
}
.steplist .s .nm{font-family:var(--mono);font-size:13px}
/* plan变体用在「将要执行的步骤」上：说明文字紧贴步骤名，
   而不是被 auto 列甩到行尾——那样两者之间隔着半屏空白，读不成一句话。 */
/* 类名不能叫.note——那是全局的提示框（有底色与左边框），
   同名会让每条步骤说明变成一个色块。 */
.steplist.plan .s{grid-template-columns:26px 148px minmax(0,1fr)}
.steplist.plan .s .step-note{font-size:12.5px;color:var(--ink-3)}
.steplist .s.pending .nm{color:var(--ink-3)}
.steplist .s.failed .nm{color:var(--bad);font-weight:600}
.steplist .s.running .nm{color:var(--run);font-weight:600}

/* ── 一次性密钥面板 ───────────────────────────────
   这是全站唯一「看完就没了」的东西，所以它必须长得跟别的都不一样：
   借终端那套深色，明确它是要被复制走的机器值，而不是页面上的一段信息。
   刷新即消失，视觉上也要让人当场就想复制。 */
.reveal{
  background:var(--term-bg);border:1px solid var(--accent);border-radius:var(--r-lg);
  overflow:hidden;margin-bottom:22px;box-shadow:0 0 0 3px var(--accent-wash);
}
.reveal-hd{padding:14px 18px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.reveal-hd b{display:block;color:#e8edf3;font-size:14px;margin-bottom:3px}
.reveal-hd span{font-size:12.5px;color:#8b96a5}
.reveal-row{padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.06)}
.reveal-meta{display:flex;gap:12px;align-items:baseline;margin-bottom:7px;font-size:12px}
.reveal-meta .mono{color:#c8d2de}
.reveal-meta .muted{color:#7b8697}
.reveal-cdk{
  display:block;background:rgba(255,255,255,.06);color:#e8edf3;
  padding:12px 14px;border-radius:var(--r-sm);font-family:var(--mono);font-size:13px;
  word-break:break-all;user-select:all;
}
.reveal-foot{margin:0;padding:12px 18px;font-size:12.5px;color:#8b96a5}
.reveal-foot code{background:rgba(255,255,255,.07);color:#9fb0c2}

/* 配额小标签：3个项目的上限是产品硬规则，页面上要看得见。 */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{
  display:inline-flex;align-items:center;gap:9px;padding:5px 12px;border-radius:20px;
  border:1px solid var(--line);background:var(--panel);font-size:12.5px;
}
.chip .num{color:var(--ink-3)}
.chip-full{border-color:var(--warn);color:var(--warn);background:var(--warn-wash)}
.chip-full .num{color:var(--warn)}

/* 待添加的DNS记录：贴在对应域名行下面，可直接选中复制。 */
.dnsrec{
  display:flex;flex-direction:column;gap:6px;padding:11px 13px;
  border-left:3px solid var(--warn);background:var(--warn-wash);border-radius:0 6px 6px 0;
}
.dnsrec code{background:var(--panel);padding:7px 10px;border-radius:4px;user-select:all;font-size:12.5px}

.filters{display:flex;gap:8px;align-items:center}
.filters select{width:auto;min-width:130px;padding:5px 9px;font-size:12.5px}
.pager{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line-soft)}

/* ── 运行详情：步骤表 + 终端 ─────────────────────── */
/* 日志是这一页的主体，所以让它吃满视口高度；步骤表跟着滚动固定住，
   翻长日志时「现在跑到第几步」始终在视线里。 */
.runsplit{display:grid;grid-template-columns:274px minmax(0,1fr);gap:22px;align-items:start}
.runsplit .side{position:sticky;top:96px}

.term{background:var(--term-bg);border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line)}
.term-hd{
  display:flex;align-items:center;gap:10px;padding:9px 14px;
  border-bottom:1px solid rgba(255,255,255,.08);
  font-family:var(--mono);font-size:11px;color:#8b96a5;letter-spacing:.04em;
}
.term-hd .lamp{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.term-hd .lamp.live{background:var(--run);animation:pulse 1.4s ease-in-out infinite}
.term-hd .spacer{margin-left:auto}
.term-bd{
  margin:0;padding:14px 16px;overflow:auto;
  height:calc(100vh - 224px);min-height:320px;
  font-family:var(--mono);font-size:12.5px;line-height:1.65;
  color:var(--term-ink);white-space:pre-wrap;word-break:break-word;
}
.term-bd:empty{padding:0;height:auto;min-height:0}
.term-empty{
  padding:34px 20px 40px;text-align:center;
  font-family:var(--mono);font-size:12.5px;line-height:1.9;color:#7b8697;
}
.term-empty code{background:rgba(255,255,255,.07);color:#9fb0c2;padding:2px 6px}
.term-bd::selection{background:var(--accent);color:var(--accent-ink)}

</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="rail-brand">
      <span class="mark">cc</span>
      <span><b>ccw</b><span class="sub">控制台</span></span>
    </div>
    <nav class="rail-nav">
      <div class="nav-label">运维</div>
      <a class="nav-item" href="/admin" {{if eq .Nav "dashboard"}}aria-current="page"{{end}}>
        <span class="dot"></span>总览
      </a>
      <a class="nav-item" href="/admin/nodes" {{if eq .Nav "nodes"}}aria-current="page"{{end}}>
        <span class="dot"></span>机队
        {{if .NodeCount}}<span class="tally">{{.NodeCount}}</span>{{end}}
      </a>
      <div class="nav-label">接入</div>
      <a class="nav-item" href="/admin/cdks" {{if eq .Nav "cdks"}}aria-current="page"{{end}}>
        <span class="dot"></span>项目与 CDK
      </a>
      <a class="nav-item" href="/admin/domains" {{if eq .Nav "domains"}}aria-current="page"{{end}}>
        <span class="dot"></span>域名
      </a>
      <div class="nav-label">记录</div>
      <a class="nav-item" href="/admin/audit" {{if eq .Nav "audit"}}aria-current="page"{{end}}>
        <span class="dot"></span>审计日志
      </a>
    </nav>
    <div class="rail-foot">
      <div class="theme" role="group" aria-label="主题">
        <button type="button" data-theme-set="auto">自动</button>
        <button type="button" data-theme-set="light">浅色</button>
        <button type="button" data-theme-set="dark">深色</button>
      </div>
      <div class="who">
        <span class="av">{{.Initial}}</span>
        <span class="nm">{{.Username}}</span>
      </div>
      <form method="POST" action="/admin/logout">
        <input type="hidden" name="csrf_token" value="{{.CSRF}}">
        <button class="signout" type="submit">退出登录</button>
      </form>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1>{{block "pagetitle" .}}控制台{{end}}</h1>
      {{block "pagesub" .}}{{end}}
      <span class="spacer"></span>
      {{block "pageactions" .}}{{end}}
    </header>
    <div class="content">
      {{block "content" .}}{{end}}
    </div>
  </div>
</div>

<script>
(function () {
  // 主题开关：auto 不写 data-theme，交回给 prefers-color-scheme。
  var btns = document.querySelectorAll('[data-theme-set]');
  function mark(cur) {
    btns.forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.themeSet === cur ? 'true' : 'false');
    });
  }
  var saved = 'auto';
  try { saved = localStorage.getItem('ccw-theme') || 'auto'; } catch (e) {}
  mark(saved);
  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      var v = b.dataset.themeSet;
      if (v === 'auto') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', v);
      try { localStorage.setItem('ccw-theme', v); } catch (e) {}
      mark(v);
    });
  });
})();
</script>
</body>
</html>{{end}}
